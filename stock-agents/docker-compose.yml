services:
  stock-api:
    build: .
    ports:
      # na serwerze ustaw API_BIND=127.0.0.1 — API nie musi być publiczne (n8n łączy się po sieci compose)
      - "${API_BIND:-0.0.0.0}:${API_PORT:-8000}:8000"
    env_file:
      - .env
    environment:
      API_HOST: "0.0.0.0"
      API_PORT: "8000"
    restart: unless-stopped
    healthcheck:
      # python:3.12-slim nie ma curl — używamy urllib z obrazu
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/health').status==200 else 1)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

  # n8n — orkiestrator: odpytuje endpointy stock-api i przepuszcza dane przez LLM.
  # W tej samej sieci compose n8n dobija się do API po nazwie serwisu: http://stock-api:8000
  n8n:
    image: docker.n8n.io/n8nio/n8n:latest
    ports:
      - "${N8N_PORT:-5678}:5678"
    environment:
      # lokalnie, jednoosobowo — wyłącz logowanie/rejestrację (zero loginu po restarcie).
      # NA SERWERZE (Mikrus itp.) ustaw w .env: N8N_USER_MANAGEMENT_DISABLED=false !
      N8N_USER_MANAGEMENT_DISABLED: "${N8N_USER_MANAGEMENT_DISABLED:-true}"
      # localhost po HTTP — bez tego logowanie potrafi się wykrzaczyć na "secure cookie"
      N8N_SECURE_COOKIE: "${N8N_SECURE_COOKIE:-false}"
      # na serwerze: publiczny adres n8n (np. https://twojvps.wykr.es:PORT) — patrz DEPLOYMENT.md
      WEBHOOK_URL: "${N8N_WEBHOOK_URL:-}"
      N8N_HOST: "${N8N_HOST:-}"
      N8N_PROTOCOL: "${N8N_PROTOCOL:-http}"
      N8N_PROXY_HOPS: "${N8N_PROXY_HOPS:-0}"
      GENERIC_TIMEZONE: "Europe/Warsaw"
      TZ: "Europe/Warsaw"
      # opcjonalnie: klucz z .env (i tak credential do Anthropic ustawiasz w UI n8n)
      ANTHROPIC_API_KEY: "${ANTHROPIC_API_KEY:-}"
    volumes:
      - n8n_data:/home/node/.n8n
    # dostęp do usług na hoście (np. scripts/claude_proxy.py — claude -p z subskrypcji,
    # bez płatnego API) pod nazwą host.docker.internal
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      - stock-api
    restart: unless-stopped

volumes:
  n8n_data:
