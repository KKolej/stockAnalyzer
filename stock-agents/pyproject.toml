[tool.poetry]
name = "stock-agents"
version = "0.1.0"
description = "Agenty do analizy technicznej akcji (GPW + rynki zagraniczne)"
authors = ["bkolej <b.kolej@gmail.com>"]
readme = "README.md"
packages = [{ include = "stock_agents", from = "src" }]

[tool.poetry.scripts]
stock-agents = "stock_agents.cli:main"
sentiment-agents = "stock_agents.agents.sentiment.cli:main"
fundamental-agents = "stock_agents.agents.fundamental.cli:main"
speculator-agents = "stock_agents.agents.speculator.cli:main"
screener-agents = "stock_agents.agents.screener.cli:main"
macro-agents = "stock_agents.agents.macro.cli:main"
dcf-agents = "stock_agents.agents.dcf.cli:main"
compare-agents = "stock_agents.agents.compare.cli:main"
stock-api = "stock_agents.api.server:main"

[tool.poetry.dependencies]
python = "^3.12"
pandas = "^2.2"
numpy = "^2.0"
pandas-ta = { version = ">=0.4.71b0", allow-prereleases = true }
yfinance = "^1.4.0"
python-dotenv = "^1.0"
fastapi = "^0.115"
uvicorn = {extras = ["standard"], version = "^0.49.0"}
# Scraping GPW (Biznesradar, Bankier, Stockwatch) — wcześniej tylko tranzytywnie
beautifulsoup4 = "^4.12"
lxml = ">=5.0"
# Opcjonalne: tryb sentiment --mode claude
anthropic = { version = "^0.40", optional = true }

[tool.poetry.extras]
claude = ["anthropic"]

[tool.poetry.group.dev.dependencies]
pytest = "^8.3"
pytest-cov = "^5.0"
ruff = "^0.9"
mypy = "^1.13"
pandas-stubs = "^2.2"
httpx = "^0.28.1"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--tb=short -q"

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["B008"]

[tool.mypy]
python_version = "3.12"
strict = true
ignore_missing_imports = true

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
