[tool.poetry]
name = "stock-agents"
version = "0.1.0"
description = "Agenty do analizy technicznej akcji (GPW + rynki zagraniczne)"
authors = ["bkolej <b.kolej@gmail.com>"]
readme = "README.md"
packages = [{ include = "stock_agents", from = "src" }]

[tool.poetry.scripts]
stock-agents = "stock_agents.cli:main"

[tool.poetry.dependencies]
python = "^3.12"
pandas = "^2.2"
pandas-ta = { version = ">=0.4.71b0", allow-prereleases = true }
yfinance = "^1.4.0"
python-dotenv = "^1.0"

[tool.poetry.group.dev.dependencies]
pytest = "^8.3"
pytest-cov = "^5.0"
ruff = "^0.9"
mypy = "^1.13"
pandas-stubs = "^2.2"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--tb=short -q"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["B008"]

[tool.mypy]
python_version = "3.12"
strict = true
ignore_missing_imports = true

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
